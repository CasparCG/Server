name: Build Windows

on:
    push:
        # branches: [ "master" ]
    pull_request:
        branches: ["master"]

concurrency:
    # Release refs (master, v*.x and v*.x-lts branches such as v2.5.x and v2.3.x-lts, tags) get a group unique per ref+commit, so a later push
    # to one of them can never replace another release push's still-pending run in the same
    # group - GitHub's default "queue: single" behavior cancels a pending run whenever a new one
    # is queued into the same group, independent of cancel-in-progress (which only governs the
    # already-running run). Including the ref alongside the commit sha keeps two tags that point
    # at the same commit from colliding into one group. Everything else keeps sharing one group
    # per PR/branch as before.
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || ((github.ref == 'refs/heads/master' || (startsWith(github.ref, 'refs/heads/v') && (endsWith(github.ref, '.x') || endsWith(github.ref, '.x-lts'))) || startsWith(github.ref, 'refs/tags/')) && format('{0}-{1}', github.ref, github.sha)) || github.ref }}
    cancel-in-progress: ${{ !(github.ref == 'refs/heads/master' || (startsWith(github.ref, 'refs/heads/v') && (endsWith(github.ref, '.x') || endsWith(github.ref, '.x-lts'))) || startsWith(github.ref, 'refs/tags/')) }}

jobs:
    build:
        runs-on: windows-2022
        timeout-minutes: 120

        steps:
            - uses: actions/checkout@v7

            - name: Download media-scanner
              uses: robinraju/release-downloader@v1.13
              with:
                  repository: "casparcg/media-scanner"
                  latest: true
                  fileName: "*-win32-x64.zip"
                  tarBall: false
                  zipBall: false
                  out-file-path: "media-scanner"
                  extract: true

            - name: Run build
              run: |
                  ./tools/windows/build.bat
              env:
                  CI: 1
                  MEDIA_SCANNER_FOLDER: "..\\media-scanner"

            - name: Rename build
              id: "rename-build"
              shell: bash
              run: |
                  TARGET=casparcg-server-${{ github.sha }}-windows.zip
                  mv dist/casparcg_server.zip "$TARGET"

                  echo "artifactname=$TARGET" >> $GITHUB_OUTPUT

                  # check if a release branch, or master, or a tag
                  if [[ "${{ github.ref_name }}" == "master" || "${{ github.ref_name }}" == "2.3.x-lts" ]]
                  then
                    # Only report if we have an sftp password
                    if [ -n "${{ secrets.SFTP_PASSWORD }}" ]
                    then
                        echo "uploadname=$TARGET" >> $GITHUB_OUTPUT
                    fi
                  fi

            - uses: actions/upload-artifact@v7
              with:
                  path: ${{ steps.rename-build.outputs.artifactname }}
                  archive: false

            - name: Copy single file to remote
              uses: garygrossgarten/github-action-scp@0.10.0
              if: ${{ steps.rename-build.outputs.uploadname }}
              timeout-minutes: 5
              with:
                  local: "${{ steps.rename-build.outputs.uploadname }}"
                  remote: "${{ secrets.SFTP_ROOT }}/${{ github.ref_name }}/${{ steps.rename-build.outputs.uploadname }}"
                  host: ${{ secrets.SFTP_HOST }}
                  username: ${{ secrets.SFTP_USERNAME }}
                  password: ${{ secrets.SFTP_PASSWORD }}
